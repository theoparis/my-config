autogenerated=0

monitor=DP-4,1920x1080@60,1920x0,1
monitor=DP-3,1920x1080@60,1920x0,1
monitor=eDP-1,1920x1200@60,0x0,1
workspace=eDP-1,1

input {
    kb_layout=
    kb_variant=
    kb_model=
    kb_options=
    kb_rules=

    follow_mouse=1

		touchpad {
			disable_while_typing=false
		}
}

general {
    sensitivity=1.0

    gaps_in=5
    gaps_out=20
    border_size=2
    col.active_border=0x66ee1111
    col.inactive_border=0x66333333
}

decoration {
    rounding=10
    blur=1
    blur_size=3
    blur_passes=2
}

animations {
    enabled=1
    speed=7
    curve=default
    windows_curve=default
    windows_speed=6
    windows=1
    borders=1
    borders_speed=20
    fadein=1
    fadein_speed=20
}

dwindle {
    pseudotile=0
}

$main_mod = SUPER

windowrule=move 69 420,abc
windowrule=size 420 69,abc
windowrule=tile,xyz
windowrule=float,abc
windowrule=pseudo,abc
windowrule=monitor 0,xyz

exec-once=/usr/lib/xdg-desktop-portal-wlr
exec-once=waybar -c ~/.config/waybar/config.json
exec-once=mako
exec-once=mpd ~/.config/mpd/mpd.conf --no-daemon
exec-once=~/monitors
exec-once=wmname LG3D
exec-once=ipfs daemon

#exec-once=mpvpaper eDP-1 "https://www.youtube.com/watch?v=iYMdmxgZZk0"

bind=SUPER,return,exec,foot
bind=SUPER,Y,exec,sh -c 'slurp | grim -g - -t png - | wl-copy -t image/png'
bind=SUPERSHIFT,Q,killactive,
bind=SUPER,M,exec,pkill Hyprland
bind=SUPER,V,togglefloating,
bind=SUPER,D,exec,tofi-run | zsh -
bind=SUPER,P,pseudo,

bind=SUPER,h,movewindow,l
bind=SUPER,l,movewindow,r
bind=SUPER,k,movewindow,u
bind=SUPER,j,movewindow,d

bind = $main_mod, 1, workspace, 1
bind = $main_mod, 2, workspace, 2
bind = $main_mod, 3, workspace, 3
bind = $main_mod, 4, workspace, 4
bind = $main_mod, 5, workspace, 5
bind = $main_mod, 6, workspace, 6
bind = $main_mod, 7, workspace, 7
bind = $main_mod, 8, workspace, 8
bind = $main_mod, 9, workspace, 9
bind = $main_mod, 0, workspace, 10

# Move active window to a workspace with main_mod + SHIFT + [0-9]
bind = $main_mod SHIFT, 1, movetoworkspace, 1
bind = $main_mod SHIFT, 2, movetoworkspace, 2
bind = $main_mod SHIFT, 3, movetoworkspace, 3
bind = $main_mod SHIFT, 4, movetoworkspace, 4
bind = $main_mod SHIFT, 5, movetoworkspace, 5
bind = $main_mod SHIFT, 6, movetoworkspace, 6
bind = $main_mod SHIFT, 7, movetoworkspace, 7
bind = $main_mod SHIFT, 8, movetoworkspace, 8
bind = $main_mod SHIFT, 9, movetoworkspace, 9
bind = $main_mod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with main_mod + scroll
bind = $main_mod, mouse_down, workspace, e+1
bind = $main_mod, mouse_up, workspace, e-1

# Move/resize windows with main_mod + LMB/RMB and dragging
bindm = $main_mod, mouse:272, movewindow
bindm = $main_mod, mouse:273, resizewindow
