autogenerated=0
monitor=HDMI-A-2,1920x1080@60,0x0,1
monitor=HDMI-A-1,1920x1080@60,0x0,1
workspace=HDMI-A-2,1
workspace=HDMI-A-1,1

monitor=DP-4,1920x1080@60,1920x0,1
monitor=DP--3,1920x1080@60,1920x0,1

input {
    kb_layout=
    kb_variant=
    kb_model=
    kb_options=
    kb_rules=

    follow_mouse=1
}

general {
    max_fps=60
    sensitivity=1.0
    main_mod=SUPER

    gaps_in=5
    gaps_out=20
    border_size=2
    col.active_border=0x66ee1111
    col.inactive_border=0x66333333

    damage_tracking=monitor
}

decoration {
    rounding=10
    blur=1
    blur_size=3
    blur_passes=2
}

animations {
    enabled=1
    speed=7
    curve=default
    windows_curve=default
    windows_speed=6
    windows=1
    borders=1
    borders_speed=20
    fadein=1
    fadein_speed=20
}

dwindle {
    pseudotile=0
}

windowrule=move 69 420,abc
windowrule=size 420 69,abc
windowrule=tile,xyz
windowrule=float,abc
windowrule=pseudo,abc
windowrule=monitor 0,xyz

exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=/usr/lib/xdg-desktop-portal
exec-once=/usr/lib/xdg-desktop-portal-wlr
exec-once=yambar
exec-once=dunst
exec-once=nm-applet
exec-once=mpd ~/.config/mpd/mpd.conf --no-daemon
exec-once=~/monitors
exec-once=wmname LG3D
exec-once=mpvpaper -vs -o "no-audio loop" "*" ~/wallpapers/sea_33194.mp4

bind=SUPER,return,exec,alacritty
bind=SUPER,Y,exec,sh -c 'slurp | grim -g - -t png - | wl-copy -t image/png'
bind=SUPERSHIFT,Q,killactive,
bind=SUPER,M,exec,pkill Hyprland
bind=SUPER,V,togglefloating,
bind=SUPER,D,exec,bemenu-run
bind=SUPER,P,pseudo,

bind=SUPER,left,movefocus,l
bind=SUPER,right,movefocus,r
bind=SUPER,up,movefocus,u
bind=SUPER,down,movefocus,d

bind=SUPER,1,workspace,1
bind=SUPER,2,workspace,2
bind=SUPER,3,workspace,3
bind=SUPER,4,workspace,4
bind=SUPER,5,workspace,5
bind=SUPER,6,workspace,6
bind=SUPER,7,workspace,7
bind=SUPER,8,workspace,8
bind=SUPER,9,workspace,9
bind=SUPER,0,workspace,10

bind=ALT,1,movetoworkspace,1
bind=ALT,2,movetoworkspace,2
bind=ALT,3,movetoworkspace,3
bind=ALT,4,movetoworkspace,4
bind=ALT,5,movetoworkspace,5
bind=ALT,6,movetoworkspace,6
bind=ALT,7,movetoworkspace,7
bind=ALT,8,movetoworkspace,8
bind=ALT,9,movetoworkspace,9
bind=ALT,0,movetoworkspace,10
